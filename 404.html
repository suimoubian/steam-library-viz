<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>页面不存在 · 返回首页</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{height:100%%;margin:0;background:#0B1118;color:#E8EFF5;
    font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    display:flex;align-items:center;justify-content:center}
  .box{text-align:center;max-width:520px;padding:32px}
  .code{font:700 64px/1 Consolas,monospace;color:#00E5FF;letter-spacing:2px}
  p{color:#8FA6B8;line-height:1.9;margin:18px 0}
  a{display:inline-block;margin-top:10px;padding:10px 26px;border:1px solid #00E5FF;
    border-radius:6px;color:#00E5FF;text-decoration:none}
  a:hover{background:rgba(0,229,255,.12)}
</style>
</head>
<body>
<div class="box">
  <div class="code">404</div>
  <p>这个地址没有内容。<br>演示页面在站点根目录。</p>
  <!-- 用相对路径，站点挂在子目录（如 /仓库名/）时也能正确返回 -->
  <a href="./">← 返回演示首页</a>
</div>
</body>
</html>
